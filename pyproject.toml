[project]
name = "influencematch-local"
version = "0.1.0"
description = "Local influencer matching using user-supplied, provenance-recorded data"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
  "streamlit>=1.42,<2",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.6,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
bigdata = ["pyspark>=4.0,<5"]
repod = ["odfpy>=1.4,<2", "requests>=2.32,<3"]
datasets = ["openpyxl>=3.1,<4", "requests>=2.32,<3"]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
